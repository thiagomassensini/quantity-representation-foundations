name: Paper LaTeX CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'paper/**'
      - '.github/workflows/paper-latex.yml'
  push:
    branches: [main]
    paths:
      - 'paper/**'
      - '.github/workflows/paper-latex.yml'

jobs:
  build-paper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile manuscript
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: paper
          root_file: CONSERVATION_OF_QUANTITATIVE_INFORMATION.tex
          latexmk_use_lualatex: false

      - name: Upload compiled PDF
        uses: actions/upload-artifact@v4
        with:
          name: conservation-quantitative-information-pdf
          path: paper/CONSERVATION_OF_QUANTITATIVE_INFORMATION.pdf
          if-no-files-found: error
