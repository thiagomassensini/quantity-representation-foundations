name: Lean CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: true
      - name: Print actual axiom dependencies
        run: lake env lean QuantityRepresentationFoundations/AxiomProbe.lean
